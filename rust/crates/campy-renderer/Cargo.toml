[package]
name = "campy-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zgui.workspace = true
zgui-profile.workspace = true
zgui-ui.workspace = true
zgui-editor.workspace = true
zgui-terminal.workspace = true
# The Gleam grammar for the code editor's highlighting (tree-sitter 0.26 is
# the version zgui-editor builds against; LanguageFn bridges the ABI).
tree-sitter = "0.26"
tree-sitter-gleam = "1.0.0"
# The console kind's channel transport (same version/features as
# zgui-terminal's own use).
flume = { version = "0.12", default-features = false }
# The embedder builds its own event loop (with_any_thread) driving zgui's
# public WinitApp; same version the platform backend uses.
zgui-platform-winit = { git = "https://github.com/zortax/zgui" }
winit = "0.30.13"
# The headless smoke driver rides the same platform contract as winit.
zgui-platform-headless = { git = "https://github.com/zortax/zgui", optional = true }
# The screenshot debug knob rebuilds zgui's own window renderer so it can copy
# one frame back (both already in the pinned zgui tree and the build graph).
zgui-render-wgpu = { git = "https://github.com/zortax/zgui" }
zgui-render-vector-vello = { git = "https://github.com/zortax/zgui" }
# Encoding that one frame; already in the graph through zgui-image.
png = "0.18"
# The designer's grid is drawn, not painted by a background rule (zgui's CSS
# layer has no gradient images). Same version zgui's own canvas uses.
kurbo = "0.13"

[features]
# Headless driver for the smoke suite: scripted surface events, virtual
# clock, scene reads — no window system required.
ui-testing = ["dep:zgui-platform-headless"]
