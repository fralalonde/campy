[workspace]
members = ["crates/campy-bridge", "crates/campy-renderer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
publish = false

[workspace.dependencies]
rustler = "=0.39.0"

# The zgui stack, one git source for all (the branch head is recorded and
# pinned by the committed Cargo.lock; `just` builds pass --locked, so the
# resolution never drifts silently). zgui-editor and zgui-terminal are not
# published on crates.io; they themselves consume zgui from the same URL,
# which keeps the whole tree on one source.
zgui = { git = "https://github.com/zortax/zgui" }
zgui-ui = { git = "https://github.com/zortax/zgui" }
zgui-editor = { git = "https://github.com/zortax/zgui-editor" }
zgui-terminal = { git = "https://github.com/zortax/zgui-terminal" }
