name = "campy_form"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.16.0 and < 2.0.0"

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 1.0.0"
campy_ccl = { path = "../campy_ccl" }
# Wire types only (`ControlDesc`/`WireValue` for `campy_form/live_preview`).
# campy_form never calls a bridge function or opens a session.
campy_bridge = { path = "../campy_bridge" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
